# Despliegue en Netlify. La raiz del sitio es app/, pero el repo entero se
# clona, asi que ../style/build.mjs sigue existiendo durante la build.
[build]
  base = "app"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# La PWA es de una sola pagina: cualquier ruta devuelve index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# La geolocalizacion exige HTTPS. Netlify ya lo da, esto solo lo asegura.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000"
